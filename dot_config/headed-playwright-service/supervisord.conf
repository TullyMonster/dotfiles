[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[eventlistener:restart-mcp-on-browser-exit]
command=/usr/local/bin/restart-mcp-on-browser-exit
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
priority=5
autostart=true
autorestart=true
startsecs=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:xvfb]
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_XVFB_WHD)s -nolisten tcp
priority=10
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:openbox]
command=/usr/bin/openbox
priority=20
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="/root"
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:bound-browser]
command=/usr/local/bin/start-bound-browser
priority=30
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="/root"
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/usr/bin/x11vnc -display %(ENV_DISPLAY)s -localhost -nopw -forever -shared -rfbport %(ENV_VNC_PORT)s
priority=40
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="/root"
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc --heartbeat=30 %(ENV_NOVNC_HOST)s:%(ENV_NOVNC_PORT)s %(ENV_VNC_HOST)s:%(ENV_VNC_PORT)s
priority=50
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:playwright-mcp]
command=/usr/local/bin/start-playwright-mcp
priority=60
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="/root"
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
