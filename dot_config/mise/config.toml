github-cli = "latest"
"github:missdeer/ace-tool-rs" = { version = "latest", rename_exe = "ace-tool" }
"github:peteretelej/tree" = "latest"
"github:tealdeer-rs/tealdeer" = { version = "latest", bin = "tldr" }
jd = "latest"
jq = "latest"
lazygit = "latest"
marksman = "latest"
node = "lts"
"npm:@fission-ai/openspec" = "latest"
"npm:czg" = "latest"
"npm:pyright" = "latest"
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"
"npm:yaml-language-server" = "latest"
opencode = "latest"
pnpm = "latest"
prettier = "latest"
ripgrep = "latest"
ruff = "latest"
taplo = "latest"
tree-sitter = "latest"
usage = "latest"
uv = "latest"
yq = "latest"
zoxide = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node", "bun", "python"]
node.corepack = true
npm.package_manager = "pnpm"
python.uv_venv_auto = "create|source"
