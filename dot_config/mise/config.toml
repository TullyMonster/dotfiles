[settings]
idiomatic_version_file_enable_tools = ["node", "bun", "python"]
node.corepack = true
npm.package_manager = "pnpm"
python.uv_venv_auto = "create|source"

[bootstrap.hooks.pre-packages]
run = '"$HOME/.local/libexec/mise-bootstrap/configure-xpra-apt-repository"'

[bootstrap.packages]
"apt:7zip" = "latest"
"apt:build-essential" = "latest"
"apt:bzip2" = "latest"
"apt:ca-certificates" = "latest"
"apt:curl" = "latest"
"apt:git" = "latest"
"apt:moreutils" = "latest"
"apt:nala" = "latest"
"apt:network-manager" = "latest"
"apt:openssh-server" = "latest"
"apt:plocate" = "latest"
"apt:podman" = "latest"
"apt:unar" = "latest"
"apt:unzip" = "latest"
"apt:wget" = "latest"
"apt:xpra" = "latest"
"apt:xz-utils" = "latest"
"apt:zsh" = "latest"
"apt:zstd" = "latest"

[bootstrap.user]
login_shell = "/usr/bin/zsh"

[tools]
bat = "latest"
biome = "latest"
btop = "latest"
bun = "latest"
cmake = "latest"
delta = "latest"
fastfetch = "latest"
fd = "latest"
fzf = "latest"
gdu = "latest"
git-filter-repo = "latest"
github-cli = "latest"
"github:BtbN/FFmpeg-Builds" = { version = "latest", asset_pattern = "ffmpeg-*-linux64-gpl.tar.xz" }
"github:JFryy/systemd-lsp" = "latest"
"github:achristmascarl/rainfrog" = "latest"
"github:babarot/gomi" = "latest"
"github:cortexkit/magic-context" = { version = "latest", version_prefix = "dashboard-v", matching_regex = "AppImage", bin = "magic-context-dashboard" }
"github:gu1llaum-3/sshm" = "latest"
"github:joshmedeski/sesh" = "latest"
"github:micro-editor/micro" = "latest"
"github:missdeer/ace-tool-rs" = { version = "latest", rename_exe = "ace-tool" }
"github:peteretelej/tree" = "latest"
"github:svenstaro/miniserve" = "latest"
"github:tealdeer-rs/tealdeer" = { version = "latest", bin = "tldr" }
"github:us/crw" = "latest"
"github:zhoufanscut/oModel" = "latest"
jd = "latest"
jq = "latest"
lazygit = "latest"
marksman = "latest"
neovim = "latest"
node = "lts"
"npm:@colbymchenry/codegraph" = "latest"
"npm:@cortexkit/magic-context" = "latest"
"npm:@fission-ai/openspec" = "latest"
"npm:@playwright/cli" = "latest"
"npm:@playwright/test" = "latest"
"npm:@sammysnake/fast-context-mcp" = { version = "latest", pnpm_args = "--registry=https://registry.npmjs.org/" }
"npm:@slkiser/opencode-quota" = "latest"
"npm:aistupidmeter" = "latest"
"npm:czg" = "latest"
"npm:jsonc-cli" = "latest"
"npm:pyright" = "latest"
"npm:skills" = "latest"
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"
"npm:uipro-cli" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:yaml-language-server" = { version = "latest", pnpm_args = "--config.node-linker=hoisted" }
opencode = "latest"
pnpm = "latest"
prettier = "latest"
python = "3.13"
ripgrep = "latest"
ruff = "latest"
rust = "stable"
shellcheck = "latest"
shfmt = "latest"
sqlite = "latest"
systemctl-tui = "latest"
taplo = "latest"
tmux = "latest"
tree-sitter = "latest"
usage = "latest"
uv = "latest"
viddy = "latest"
xh = "latest"
yq = "latest"
zoxide = "latest"
