# ==================================================
# TPM 操作：
#   - prefix + I        安装新插件并刷新 tmux 环境
#   - prefix + U        更新已安装插件
#   - prefix + Alt + u  卸载已从插件列表移除的插件
# ==================================================

unbind C-b                                                                          # 取消默认的前缀键 (prefix)
set -g prefix C-x                                                                   # 将 prefix 设为 Ctrl+x
bind C-x send-prefix                                                                # 按 prefix 后再次按下 Ctrl+x，则向当前程序发送 Ctrl+x
set -g mouse on                                                                     # 启用鼠标支持
set -g set-clipboard on                                                             # 启用 OSC 52 剪贴板
set -g allow-passthrough on                                                         # 允许 OSC 52 序列穿透 tmux 传递到外层终端
set -g status-style 'fg=#FFFFFF,bg=green'                                           # 状态栏默认样式
set -g window-status-format '#[fg=#185C37,bg=green]#{=|10|…:window_name}###I'       # 非当前窗口样式
set -g window-status-current-format '#[fg=#FFFFFF,bg=green][#{=|10|…:window_name}]' # 当前窗口样式
set -g automatic-rename-format '#{?pane_in_mode,tmux,#{pane_current_command}}'      # 根据面板状态自动生成窗口名

# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
# >>>>>    TPM 插件列表    <<<<<
# <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<
### 插件管理器
set -g @plugin 'tmux-plugins/tpm'

### 多数人都能接受的配置优化
set -g @plugin 'tmux-plugins/tmux-sensible'
bind R source-file "$XDG_CONFIG_HOME/tmux/tmux.conf"            # 使用 prefix+R 重载的配置文件位置

### 会话的保存和恢复
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '15'                            # 每 15 分钟自动保存一次
set -g @continuum-restore 'on'                                  # 自动恢复最近保存的会话环境

### 按下前缀键时高亮
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g status-left '#{prefix_highlight}'                        # 在状态栏左侧显示前缀高亮
set -ag status-left '#[fg=#F7C736][#{=|14|…:session_name}] '    # 在状态栏左侧追加会话名
set -g @prefix_highlight_empty_prompt '   '                     # 设置提示符未显示的占位
set -g @prefix_highlight_empty_attr 'fg=default,bg=green'       # 设置空提示的默认颜色
set -g @prefix_highlight_prefix_prompt '⚐'                      # 前缀高亮提示符
set -g @prefix_highlight_bg '#B062FC'                           # 前缀高亮提示符背景色
set -g @prefix_highlight_show_sync_mode 'on'                    # 在同步窗格模式展示提示符
set -g @prefix_highlight_sync_prompt '⇄'                        # 同步窗格模式提示符
set -g @prefix_highlight_sync_mode_attr 'fg=#FFFFFF,bg=#D07A5A' # 同步窗格模式提示符颜色

### 监控 CPU、RAM 和系统负载
set -g @plugin 'thewtex/tmux-mem-cpu-load'
set -g status-left-length 20                                    # 状态栏左侧的最大字符长度
set -g status-right-length 40                                   # 状态栏右侧的最大字符长度
set -g status-right "#($XDG_CONFIG_HOME/tmux/plugins/tmux-mem-cpu-load/tmux-mem-cpu-load -v -m 1 -t 0 -a 3 -i 5)"  #  在状态栏右侧显示可用内存、CPU 和系统负载

### 无进程时滚动窗口内容。否则根据进程名称传递 ↑ / ↓ /  Page Up / Down 键，或原样传递鼠标滚轮事件
set -g @plugin 'noscript/tmux-mighty-scroll'
set -g @mighty-scroll-by-line ''                                # 按行滚动的进程列表（以空格分隔）
set -ag @mighty-scroll-by-line 'fzf '
set -ag @mighty-scroll-by-line 'gdu '
set -ag @mighty-scroll-by-line 'gomi '
set -ag @mighty-scroll-by-line 'less '
set -ag @mighty-scroll-by-line 'man '
set -ag @mighty-scroll-by-line 'omodel '
set -ag @mighty-scroll-by-line 'pager '
set -g @mighty-scroll-by-page ''                                # 按页滚动的进程列表（以空格分隔）
set -ag @mighty-scroll-by-page 'irssi '
set -ag @mighty-scroll-by-page 'vi '
set -g @mighty-scroll-pass-through ''                           # 原样接收鼠标滚动事件的进程列表（以空格分隔）
set -ag @mighty-scroll-pass-through 'btop '
set -ag @mighty-scroll-pass-through 'chezmoi '
set -ag @mighty-scroll-pass-through 'editor '
set -ag @mighty-scroll-pass-through 'lazygit '
set -ag @mighty-scroll-pass-through 'micro '
set -ag @mighty-scroll-pass-through 'nvim '
set -ag @mighty-scroll-pass-through 'opencode '
set -ag @mighty-scroll-pass-through 'vim '

### 命令或自定义操作的菜单入口
set -g @plugin 'jaclu/tmux-menus'
set -g @menus_trigger 'Space'                                   # 设置菜单触发键为空格
set -g @menus_config_file "$XDG_CONFIG_HOME/tmux/tmux.conf"     # 重载时的配置文件位置
set -g @menus_location_x 'P'                                    # 水平位置对齐到当前面板 (pane) 左侧
set -g @menus_location_y 'P'                                    # 垂直位置对齐到当前面板 (pane) 底部

run '~/.config/tmux/plugins/tpm/tpm'
